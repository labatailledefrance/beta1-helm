# Ingress Traefik : TLS (Let's Encrypt), limites par adresse IP, en-têtes.
# /ws va au serveur (WebSocket), /tiles/, /assets/ et /publications.json au
# serveur de données, le reste au client.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  labels:
    {{- include "game.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ .Values.traefik.rateLimit.average }}
    burst: {{ .Values.traefik.rateLimit.burst }}
---
# Données : rafales de lectures parallèles (une vue complète demande des
# centaines de tiles, H-06), limite propre.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-donnees
  labels:
    {{- include "game.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ .Values.traefik.rateLimitDonnees.average }}
    burst: {{ .Values.traefik.rateLimitDonnees.burst }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: in-flight-limit
  labels:
    {{- include "game.labels" . | nindent 4 }}
spec:
  inFlightReq:
    amount: {{ .Values.traefik.rateLimit.inFlight }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  labels:
    {{- include "game.labels" . | nindent 4 }}
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    referrerPolicy: no-referrer
    frameDeny: true
    customResponseHeaders:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Embedder-Policy: require-corp
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: game
  labels:
    {{- include "game.labels" . | nindent 4 }}
spec:
  entryPoints: [{{ .Values.traefik.entryPoint }}]
  routes:
    - match: Host(`{{ .Values.host }}`) && Path(`/ws`)
      kind: Rule
      middlewares:
        - { name: rate-limit }
        - { name: in-flight-limit }
      services:
        - { name: server, port: ws }
    - match: Host(`{{ .Values.host }}`) && (PathPrefix(`/tiles/`) || PathPrefix(`/assets/`) || Path(`/publications.json`))
      kind: Rule
      middlewares:
        - { name: rate-limit-donnees }
        - { name: security-headers }
      services:
        - { name: donnees, port: http }
    - match: Host(`{{ .Values.host }}`)
      kind: Rule
      middlewares:
        - { name: rate-limit }
        - { name: security-headers }
      services:
        - { name: client, port: http }
  tls:
    certResolver: {{ .Values.traefik.certResolver }}
