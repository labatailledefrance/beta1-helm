# Nom d'hôte public du jeu.
host: srv.labatailledefrance.fr

server:
  image:
    repository: ghcr.io/labatailledefrance/beta1-server
    # Digest obligatoire (sha256:…) : jamais de tag mobile.
    digest: ""
  threads: 16
  # Réseau routier de la France en mémoire (graphe, CCH, une métrique par classe
  # d'itinéraire) : 9,2 Go au pic, mesurés sur srv le 2026-11-28 (A-07).
  resources:
    requests: { cpu: "2", memory: 10Gi }
    limits: { cpu: "16", memory: 16Gi }
  # État persistant de la simulation (snapshots, A-13).
  persistence:
    size: 20Gi
    storageClass: local-path

client:
  image:
    repository: ghcr.io/labatailledefrance/beta1-client
    digest: ""
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: "1", memory: 256Mi }

# Données du jeu (H-06) : chaque publication est adressée par ses entrées
# (digest de l'image, zones) ; un Job la produit dans une PVC, le serveur de
# données la sert en lecture seule. Le Job ne refait rien si elle existe.
datachain:
  image:
    repository: ghcr.io/labatailledefrance/beta1-datachain
    digest: ""
  # Départements (D029, D974…) ou FRANCE ; vide = France entière.
  zones: []
  processus: 2
  threads: 8
  # Vrai : Job créé à l'arrêt (spec.suspend), par exemple pour copier les
  # sources de P-26 dans la PVC avant le premier téléchargement.
  suspendu: false
  resources:
    requests: { cpu: "4", memory: 8Gi }
    limits: { cpu: "16", memory: 48Gi }

assets:
  image:
    repository: ghcr.io/labatailledefrance/beta1-assets
    digest: ""
  # Secret (clé « token ») du jeton personnel Sketchfab, créé à la main :
  #   kubectl -n labatailledefrance create secret generic sketchfab --from-literal=token=…
  # Vide : pas de jeton (les modèles Sketchfab doivent alors être copiés).
  sketchfabSecret: ""
  suspendu: false
  resources:
    requests: { cpu: "1", memory: 1Gi }
    limits: { cpu: "4", memory: 4Gi }

# Serveur de données : nginx (image du client, configuration à part) qui sert
# /tiles/<id>/ et /assets/<id>/ en immuable, et /publications.json.
donnees:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "4", memory: 1Gi }

# PVC gardées à la désinstallation (helm.sh/resource-policy: keep).
stockage:
  storageClass: local-path
  # Nœud où créer les PVC dès l'installation (annotation
  # volume.kubernetes.io/selected-node) ; vide : au premier pod qui les monte
  # (local-path est en WaitForFirstConsumer).
  noeud: ""
  sources: 800Gi
  tiles: 200Gi
  assets: 5Gi

# Secret dockerconfigjson pour ghcr.io, tant que les images sont privées.
imagePullSecret: ""

traefik:
  entryPoint: websecure
  certResolver: letsencrypt
  # Namespace de Traefik : seul autorisé à joindre les pods (NetworkPolicy).
  namespace: traefik
  # Rate limits par adresse IP (H-01, H-02) : requêtes par seconde, burst, connexions simultanées.
  rateLimit:
    average: 50
    burst: 100
    inFlight: 10
  # Données (tiles, assets) : 585 tiles pour une vue de La Réunion (H-06).
  rateLimitDonnees:
    average: 200
    burst: 1000
